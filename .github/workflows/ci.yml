name: 自动化测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: 测试
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 安装浏览器
        run: python -m playwright install --with-deps chromium
      - name: API、安全与单元测试
        id: non_ui
        run: python -m pytest -m "not ui" --html=reports/api-report.html --self-contained-html
      - name: UI 测试
        if: ${{ !cancelled() && steps.non_ui.outcome != 'skipped' }}
        run: python -m pytest -m ui --html=reports/ui-report.html --self-contained-html
      - name: 上传报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 测试报告与截图
          path: |
            reports/
            test-results/
          if-no-files-found: warn
